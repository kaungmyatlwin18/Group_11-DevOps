
name: Group 11 Integration Testing

on:
  push:
    branches:
      - test/mysql-integration
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Java and MySQL Integration Tests
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.GROUP11_CI_DB_PASSWORD }}
          MYSQL_DATABASE: world
          MYSQL_USER: group11_it
          MYSQL_PASSWORD: ${{ secrets.GROUP11_CI_DB_PASSWORD }}
        ports:
          - 33061:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "33061"
      DB_USER: group11_it
      DB_PASSWORD: ${{ secrets.GROUP11_CI_DB_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify database password
        run: test -n "$DB_PASSWORD"

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Import World database
        env:
          MYSQL_PWD: ${{ secrets.GROUP11_CI_DB_PASSWORD }}
        run: |
          mysql -h 127.0.0.1 -P 33061 \
            -u root world < db/world.sql

      - name: Run all JUnit tests
        run: mvn -B clean test

      - name: Verify integration tests executed
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "target/surefire-reports/TEST-WorldDatabaseIntegrationTest.xml"
          suite = ET.parse(path).getroot()

          assert int(suite.attrib["tests"]) == 3
          assert int(suite.attrib["skipped"]) == 0
          assert int(suite.attrib["failures"]) == 0
          assert int(suite.attrib["errors"]) == 0

          print("All 3 MySQL integration tests passed.")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group11-integration-results
          path: target/surefire-reports/
          if-no-files-found: warn
