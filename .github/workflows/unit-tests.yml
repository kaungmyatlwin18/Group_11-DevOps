name: Group 11 Unit Testing

on:
  push:
    branches:
      - develop
      - test/unit-testing
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: JUnit tests without MySQL or Docker
    runs-on: ubuntu-24.04
    env:
      DB_PASSWORD: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run Maven tests
        run: mvn -B clean test
      - name: Upload JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: group11-unit-test-results
          path: target/surefire-reports/
          if-no-files-found: warn
