name: Group 11 Code Coverage

on:
  push:
    branches:
      - develop
      - test/code-coverage
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-coverage:
    name: Measure JaCoCo code coverage
    runs-on: ubuntu-24.04
    env:
      DB_PASSWORD: ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Run tests and generate coverage
        run: mvn -B clean verify
      - name: Verify report and summarize coverage
        run: |
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path('target/site/jacoco')
          assert (report / 'index.html').is_file(), 'Missing HTML coverage report'
          root = ET.parse(report / 'jacoco.xml').getroot()
          summary = ['## JaCoCo coverage (unit and H2-backed tests)',
                     '', '| Metric | Covered | Total | Coverage |',
                     '| --- | ---: | ---: | ---: |']
          for metric in ('LINE', 'BRANCH'):
              counter = root.find(f"counter[@type='{metric}']")
              assert counter is not None, f'Missing {metric} coverage counter'
              covered = int(counter.attrib['covered'])
              total = covered + int(counter.attrib['missed'])
              assert total > 0, f'No {metric.lower()} coverage data'
              summary.append(f'| {metric.title()} | {covered} | {total} | {covered / total:.2%} |')
          summary += ['', 'No application-class exclusions or minimum coverage threshold are configured.',
                      'MySQL integration tests are intentionally skipped in this workflow.']
          output = '\n'.join(summary) + '\n'
          print(output)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(output)
          PYTHON
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: group11-jacoco-coverage
          path: target/site/jacoco/
          if-no-files-found: error
